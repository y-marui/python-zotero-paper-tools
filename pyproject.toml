[project]
name = "python-zotero-paper-tools"
version = "0.1.0"
description = "CLI tools that link Zotero papers with slide-style Obsidian discussion notes, using only the local Zotero API"
authors = [{ name = "Yukihiro Marui" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
paper-find = "zotero_paper_tools.find:main"
paper-note = "zotero_paper_tools.note:main"
paper-link = "zotero_paper_tools.link:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_paper_tools"]

[tool.ruff]
line-length = 88
target-version = "py311"
# docs/dev-charter/ is a git subtree we cannot edit directly (see
# AI_CONTEXT.md); recent ruff formats fenced Python blocks in Markdown
# by default, which would otherwise flag it.
extend-exclude = ["docs/dev-charter"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
