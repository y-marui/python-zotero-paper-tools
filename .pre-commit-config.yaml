# Security hooks required by the global git hook (gitleaks / detect-private-key / .env check).
repos:
  # ----------------------------------------------------------------
  # Security (required — verified by the global git hook)
  # ----------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Required: SSH private key detection
      - id: detect-private-key
      - id: check-merge-conflict

  # Required: .env file check (hook id contains "detect-dotenv")
  - repo: local
    hooks:
      - id: detect-dotenv
        name: Block .env files
        language: fail
        entry: '.env ファイルはコミット禁止。ダミー値のみの .env.example を使うこと。'
        files: '(^|/)\.env(\.[^.]+)?$'
        exclude: '(^|/)\.env\.(example|sample|template)$'
